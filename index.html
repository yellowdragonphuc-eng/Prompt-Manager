<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Manager</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
    --col1-bg: #0B0F19;
    --col2-bg: #111827;
    --col3-bg: #182032;
    --content-bg: #0F1623;
    --border: #2A364F;
    --text-content: #E2E8F0;
    --text-title: #F8FAFC;
    --text-muted: #64748B;
    --accent: #6366F1;
    --accent-hover: #4F46E5;
    --success: #10B981;
    --danger: #EF4444;
    --warning: #F59E0B;
}
body { font-family:'Segoe UI', system-ui, sans-serif; background: var(--col3-bg); color: var(--text-content); min-height:100vh; overflow:hidden; }

/* Login */
.login-container { display:flex; justify-content:center; align-items:center; min-height:100vh; background: var(--col1-bg); }
.login-box { background: var(--col2-bg); padding:50px; border-radius:16px; text-align:center; max-width:420px; width:100%; border:1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.login-box h1 { color: var(--accent); margin-bottom:10px; font-size:28px; }
.login-box p { color: var(--text-muted); margin-bottom:30px; font-size:14px; }
.google-btn { background: var(--accent); color:white; border:none; padding:14px 28px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:10px; transition:all 0.3s; }
.google-btn:hover { background: var(--accent-hover); transform:translateY(-2px); box-shadow:0 6px 20px rgba(99,102,241,0.4); }

/* App layout */
.app-container { display:none; height:100vh; flex-direction:column; }
.app-container.active { display:flex; }
.header { background: var(--col1-bg); padding:14px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.logo { display:flex; align-items:center; gap:12px; }
.logo-icon { width:38px; height:38px; background: linear-gradient(135deg, var(--accent), #8B5CF6); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-size:20px; }
.logo h1 { font-size:18px; color: var(--text-title); font-weight:600; }
.user-info { display:flex; align-items:center; gap:14px; }
.user-avatar { width:34px; height:34px; border-radius:50%; border:2px solid var(--accent); object-fit:cover; }
.user-name { color: var(--text-content); font-size:13px; }
.logout-btn { background:transparent; color: var(--text-muted); border:1px solid var(--border); padding:7px 14px; border-radius:8px; cursor:pointer; font-size:12px; transition:all 0.3s; }
.logout-btn:hover { color: var(--danger); border-color: var(--danger); }

/* Three-pane */
.main-content { display:grid; grid-template-columns: 240px 320px 1fr; flex:1; overflow:hidden; }

/* Column 1 - Folder tree */
.col1 { background: var(--col1-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.col-header { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.col-header h3 { font-size:13px; color: var(--text-title); font-weight:600; }
.col-header button { background: var(--accent); color:white; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:11px; font-weight:600; transition:all 0.3s; }
.col-header button:hover { background: var(--accent-hover); }
.folder-tree { flex:1; overflow-y:auto; padding:8px; }
.folder-item { padding:8px 10px; border-radius:6px; cursor:pointer; display:flex; align-items:center; gap:6px; font-size:13px; color: var(--text-content); transition:all 0.2s; margin-bottom:2px; position:relative; }
.folder-item:hover { background: var(--col2-bg); }
.folder-item.active { background: var(--accent); color:white; }
.folder-item.level-1 { padding-left:24px; }
.folder-item.level-2 { padding-left:38px; }
.folder-item.level-3 { padding-left:52px; }
.folder-toggle { width:14px; font-size:10px; color: var(--text-muted); flex-shrink:0; }
.folder-item.active .folder-toggle { color: white; }
.folder-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.folder-count { font-size:11px; color: var(--text-muted); background: var(--content-bg); padding:1px 7px; border-radius:10px; flex-shrink:0; }
.folder-item.active .folder-count { background: rgba(255,255,255,0.2); color:white; }
.folder-actions { display:none; gap:3px; flex-shrink:0; }
.folder-item:hover .folder-actions { display:flex; }
.folder-action { background:transparent; border:none; color:inherit; cursor:pointer; font-size:12px; padding:2px 4px; border-radius:4px; }
.folder-action:hover { background: rgba(255,255,255,0.15); }

/* Column 2 - Prompt list */
.col2 { background: var(--col2-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.search-box { padding:12px; border-bottom:1px solid var(--border); position:relative; }
.search-box input { width:100%; padding:9px 60px 9px 32px; background: var(--content-bg); border:1px solid var(--border); border-radius:8px; color: var(--text-content); font-size:13px; }
.search-box input:focus { outline:none; border-color: var(--accent); }
.search-box::before { content:'🔍'; position:absolute; left:22px; top:50%; transform:translateY(-50%); font-size:12px; opacity:0.6; }
.search-shortcut { position:absolute; right:22px; top:50%; transform:translateY(-50%); font-size:10px; color: var(--text-muted); background: var(--content-bg); padding:2px 6px; border-radius:4px; border:1px solid var(--border); }
.prompt-list { flex:1; overflow-y:auto; padding:8px; }
.prompt-item { padding:12px; border-radius:8px; cursor:pointer; margin-bottom:6px; border:1px solid transparent; transition:all 0.2s; background: var(--content-bg); }
.prompt-item:hover { border-color: var(--border); }
.prompt-item.active { border-color: var(--accent); background: rgba(99,102,241,0.1); }
.prompt-item-title { font-size:13px; font-weight:600; color: var(--text-title); margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.prompt-item-preview { font-size:11px; color: var(--text-muted); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.4; }
.prompt-item-meta { display:flex; justify-content:space-between; margin-top:6px; font-size:10px; color: var(--text-muted); }
.add-prompt-btn { margin:12px; padding:10px; background: var(--accent); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px; transition:all 0.3s; }
.add-prompt-btn:hover { background: var(--accent-hover); }

/* Column 3 - Detail */
.col3 { background: var(--col3-bg); display:flex; flex-direction:column; overflow:hidden; }
.detail-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color: var(--text-muted); }
.detail-empty-icon { font-size:60px; margin-bottom:16px; opacity:0.3; }
.detail-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
.detail-title-section { flex:1; min-width:0; }
.detail-title { font-size:22px; color: var(--text-title); font-weight:600; margin-bottom:6px; word-wrap:break-word; }
.detail-meta { font-size:12px; color: var(--text-muted); display:flex; gap:12px; flex-wrap:wrap; }
.detail-meta span { display:inline-flex; align-items:center; gap:4px; }
.detail-actions { display:flex; gap:8px; flex-shrink:0; }
.action-btn { padding:8px 14px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; border:1px solid var(--border); background: var(--content-bg); color: var(--text-content); transition:all 0.3s; display:inline-flex; align-items:center; gap:6px; }
.action-btn:hover { border-color: var(--accent); color: var(--accent); }
.action-btn.copy { background: var(--accent); border-color: var(--accent); color:white; }
.action-btn.copy:hover { background: var(--accent-hover); }
.action-btn.copy.copied { background: var(--success); border-color: var(--success); color:white; }
.action-btn.delete { background:transparent; border-color: var(--danger); color: var(--danger); }
.action-btn.delete:hover { background: var(--danger); color:white; }
.detail-body { flex:1; overflow-y:auto; padding:24px; }
.prompt-content { background: var(--content-bg); border:1px solid var(--border); border-radius:10px; padding:20px; font-family:'Consolas','Monaco','Courier New',monospace; font-size:14px; line-height:1.7; color: var(--text-content); white-space:pre-wrap; word-wrap:break-word; }
.detail-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; }
.tag { padding:3px 10px; background: var(--content-bg); border:1px solid var(--border); color: var(--accent); border-radius:12px; font-size:11px; }
.detail-description { margin-top:16px; padding:12px 14px; background: rgba(99,102,241,0.08); border-left:3px solid var(--accent); border-radius:6px; font-size:13px; color: var(--text-content); font-style:italic; }

/* Modal */
.modal { display:none; position:fixed; inset:0; background: rgba(0,0,0,0.7); z-index:1000; justify-content:center; align-items:center; padding:20px; backdrop-filter:blur(5px); }
.modal.active { display:flex; }
.modal-content { background: var(--col2-bg); border-radius:14px; padding:26px; max-width:560px; width:100%; max-height:90vh; overflow-y:auto; border:1px solid var(--border); }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.modal-header h2 { color: var(--accent); font-size:18px; }
.close-btn { background:none; border:none; font-size:24px; cursor:pointer; color: var(--text-muted); }
.close-btn:hover { color: var(--danger); }
.form-group { margin-bottom:16px; }
.form-group label { display:block; margin-bottom:6px; font-weight:600; color: var(--text-title); font-size:12px; }
.form-group input, .form-group select, .form-group textarea { width:100%; padding:10px; background: var(--content-bg); border:1px solid var(--border); border-radius:8px; color: var(--text-content); font-size:13px; font-family:inherit; }
.form-group textarea { min-height:180px; resize:vertical; font-family:'Consolas','Monaco',monospace; line-height:1.6; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color: var(--accent); }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
.btn { padding:10px 18px; border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px; transition:all 0.3s; }
.btn-primary { background: var(--accent); color:white; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--content-bg); color: var(--text-content); border:1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); }

/* Toast */
.toast { position:fixed; bottom:24px; right:24px; padding:12px 18px; background: var(--success); color:white; border-radius:8px; font-size:13px; font-weight:600; z-index:2000; opacity:0; transform:translateY(20px); transition:all 0.3s; pointer-events:none; }
.toast.show { opacity:1; transform:translateY(0); }
.toast.error { background: var(--danger); }

/* Footer bar */
.footer-bar { padding:10px 16px; border-top:1px solid var(--border); display:flex; gap:8px; background: var(--col1-bg); }
.footer-btn { flex:1; padding:8px; background: var(--content-bg); border:1px solid var(--border); color: var(--text-content); border-radius:6px; cursor:pointer; font-size:11px; font-weight:600; transition:all 0.3s; }
.footer-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Scrollbar */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

@media (max-width: 1100px) {
    .main-content { grid-template-columns: 200px 260px 1fr; }
}
@media (max-width: 800px) {
    .main-content { grid-template-columns: 1fr; }
    .col1, .col2 { display:none; }
}
</style>
</head>
<body>

<div id="loginScreen" class="login-container">
    <div class="login-box">
        <h1>✨ Prompt Manager</h1>
        <p>Lưu trữ và quản lý prompt AI của bạn</p>
        <button class="google-btn" id="googleLoginBtn">🔐 Đăng nhập bằng Google</button>
    </div>
</div>

<div id="appContainer" class="app-container">
    <header class="header">
        <div class="logo">
            <div class="logo-icon">✨</div>
            <h1>Prompt Manager</h1>
        </div>
        <div class="user-info">
            <img id="userAvatar" class="user-avatar" src="" alt="">
            <span id="userName" class="user-name"></span>
            <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
        </div>
    </header>

    <div class="main-content">
        <div class="col1">
            <div class="col-header">
                <h3>📁 Thư mục</h3>
                <button id="addFolderBtn">+ Gốc</button>
            </div>
            <div class="folder-tree" id="folderTree"></div>
            <div class="footer-bar">
                <button class="footer-btn" id="importBtn">📥 Nhập JSON</button>
                <button class="footer-btn" id="exportBtn">📤 Xuất JSON</button>
            </div>
            <input type="file" id="importFile" accept=".json" style="display:none">
        </div>

        <div class="col2">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Tìm kiếm prompt...">
                <span class="search-shortcut">Ctrl+K</span>
            </div>
            <div class="prompt-list" id="promptList"></div>
            <button class="add-prompt-btn" id="addPromptBtn">+ Thêm Prompt mới</button>
        </div>

        <div class="col3" id="detailPane">
            <div class="detail-empty">
                <div class="detail-empty-icon">📝</div>
                <p>Chọn một prompt để xem chi tiết</p>
            </div>
        </div>
    </div>
</div>

<div id="promptModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="promptModalTitle">Thêm prompt mới</h2>
            <button class="close-btn" id="closePromptModal">&times;</button>
        </div>
        <form id="promptForm">
            <input type="hidden" id="promptId">
            <div class="form-group"><label>Tiêu đề *</label><input type="text" id="promptTitle" required placeholder="Ví dụ: Viết Script Thuyết trình"></div>
            <div class="form-group"><label>Nội dung Prompt *</label><textarea id="promptContent" required placeholder="Bạn là chuyên gia..."></textarea></div>
            <div class="form-group"><label>Mô tả ngắn</label><input type="text" id="promptDescription" placeholder="Dùng khi nào?"></div>
            <div class="form-group"><label>Thư mục *</label><select id="promptFolder" required></select></div>
            <div class="form-group"><label>Tags (phân cách bằng dấu phẩy)</label><input type="text" id="promptTags" placeholder="thuyết trình, python, code"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="cancelPromptBtn">Hủy</button>
                <button type="submit" class="btn btn-primary">Lưu</button>
            </div>
        </form>
    </div>
</div>

<div id="folderModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="folderModalTitle">Thêm thư mục</h2>
            <button class="close-btn" id="closeFolderModal">&times;</button>
        </div>
        <form id="folderForm">
            <input type="hidden" id="folderId">
            <div class="form-group"><label>Tên thư mục *</label><input type="text" id="folderName" required placeholder="Ví dụ: Thuyết trình"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="cancelFolderBtn">Hủy</button>
                <button type="submit" class="btn btn-primary" id="folderSubmitBtn">Tạo</button>
            </div>
        </form>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ✅ CONFIG APP PROMPT MANAGER
const firebaseConfig = {
    apiKey: "AIzaSyBVBGxTsyvKR0ha0s4_Syk-b7ZXt-rOBps",
    authDomain: "voicelinks.firebaseapp.com",
    projectId: "voicelinks",
    storageBucket: "voicelinks.firebasestorage.app",
    messagingSenderId: "389020652364",
    appId: "1:389020652364:web:e2eed3ef58ede6af5bf5e9",
    measurementId: "G-CRYL8J8NCB"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let currentFolder = 'all';
let selectedPrompt = null;
let prompts = [];
let folders = [];

const $ = id => document.getElementById(id);

function toast(msg, isError = false) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('error', isError);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function getUserPath() { return ['promptUsers', currentUser.uid]; }

function getAvatarUrl(user) {
    if (user.photoURL) return user.photoURL;
    const name = user.displayName || user.email || 'User';
    return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=6366F1&color=fff&size=128`;
}

onAuthStateChanged(auth, (user) => {
    if (user) {
        currentUser = user;
        $('loginScreen').style.display = 'none';
        $('appContainer').classList.add('active');
        $('userAvatar').src = getAvatarUrl(user);
        $('userAvatar').onerror = function() { this.src = 'https://ui-avatars.com/api/?name=User&background=6366F1&color=fff'; };
        $('userName').textContent = user.displayName || user.email;
        loadData();
    } else {
        currentUser = null;
        $('loginScreen').style.display = 'flex';
        $('appContainer').classList.remove('active');
    }
});

$('googleLoginBtn').addEventListener('click', async () => {
    try { await signInWithPopup(auth, provider); } 
    catch (error) { toast('Lỗi đăng nhập: ' + error.message, true); }
});

$('logoutBtn').addEventListener('click', async () => {
    try { await signOut(auth); } catch (error) { toast('Lỗi: ' + error.message, true); }
});

async function loadData() {
    if (!currentUser) return;
    try {
        const foldersSnap = await getDocs(collection(db, ...getUserPath(), 'folders'));
        folders = foldersSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        if (folders.length === 0) {
            await setDoc(doc(db, ...getUserPath(), 'folders', 'default'), {
                name: 'Chưa phân loại', createdAt: new Date().toISOString()
            });
            folders = [{ id: 'default', name: 'Chưa phân loại' }];
        }

        const promptsSnap = await getDocs(collection(db, ...getUserPath(), 'prompts'));
        prompts = promptsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        renderFolderTree();
        renderPromptList();
        renderDetail();
    } catch (error) {
        toast('Lỗi tải dữ liệu: ' + error.message, true);
    }
}

function buildTree() {
    const map = new Map();
    folders.forEach(f => map.set(f.id, { ...f, children: [] }));
    const roots = [];
    map.forEach(f => {
        if (f.parentId && map.has(f.parentId)) map.get(f.parentId).children.push(f);
        else roots.push(f);
    });
    return roots;
}

function countPromptsInFolder(folderId, includeChildren = true) {
    let count = prompts.filter(p => p.folder === folderId).length;
    if (includeChildren) {
        folders.filter(f => f.parentId === folderId).forEach(child => {
            count += countPromptsInFolder(child.id, true);
        });
    }
    return count;
}

function renderFolderTree() {
    const roots = buildTree();
    let html = `
        <div class="folder-item ${currentFolder === 'all' ? 'active' : ''}" data-folder="all">
            <span class="folder-toggle">📋</span>
            <span class="folder-name">Tất cả</span>
            <span class="folder-count">${prompts.length}</span>
        </div>
    `;

    function render(list, level = 0) {
        let out = '';
        list.forEach(f => {
            const count = countPromptsInFolder(f.id);
            const hasChildren = f.children.length > 0;
            out += `
                <div class="folder-item ${currentFolder === f.id ? 'active' : ''} level-${level}" data-folder="${f.id}">
                    <span class="folder-toggle">${hasChildren ? '▼' : '·'}</span>
                    <span class="folder-name">📁 ${f.name}</span>
                    <span class="folder-count">${count}</span>
                    <div class="folder-actions">
                        <button class="folder-action" data-action="addsub" data-id="${f.id}" title="Thêm thư mục con">➕</button>
                        <button class="folder-action" data-action="edit" data-id="${f.id}" title="Sửa">✏️</button>
                        <button class="folder-action" data-action="delete" data-id="${f.id}" title="Xóa">🗑️</button>
                    </div>
                </div>
            `;
            if (hasChildren) out += render(f.children, level + 1);
        });
        return out;
    }

    html += render(roots);
    $('folderTree').innerHTML = html;

    document.querySelectorAll('.folder-item').forEach(item => {
        item.addEventListener('click', (e) => {
            if (e.target.closest('.folder-actions')) return;
            currentFolder = item.dataset.folder;
            renderFolderTree();
            renderPromptList();
        });
    });

    document.querySelectorAll('.folder-action').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const action = btn.dataset.action;
            const id = btn.dataset.id;
            if (action === 'addsub') addSubFolder(id);
            else if (action === 'edit') editFolder(id);
            else if (action === 'delete') deleteFolder(id);
        });
    });
}

function addSubFolder(parentId) {
    const parent = folders.find(f => f.id === parentId);
    if (!parent) return;
    $('folderModalTitle').textContent = `+ Con của "${parent.name}"`;
    $('folderSubmitBtn').textContent = 'Tạo';
    $('folderId').value = '';
    $('folderName').value = '';
    $('folderName').dataset.parentId = parentId;
    $('folderModal').classList.add('active');
}

function editFolder(id) {
    const f = folders.find(x => x.id === id);
    if (!f) return;
    $('folderModalTitle').textContent = 'Sửa tên thư mục';
    $('folderSubmitBtn').textContent = 'Cập nhật';
    $('folderId').value = f.id;
    $('folderName').value = f.name;
    if (f.parentId) $('folderName').dataset.parentId = f.parentId;
    else delete $('folderName').dataset.parentId;
    $('folderModal').classList.add('active');
}

async function deleteFolder(id) {
    const f = folders.find(x => x.id === id);
    if (!f) return;
    function descendants(pid) {
        const ch = folders.filter(x => x.parentId === pid);
        let all = [...ch];
        ch.forEach(c => all = all.concat(descendants(c.id)));
        return all;
    }
    const desc = descendants(id);
    const allF = [f, ...desc];
    const ids = allF.map(x => x.id);
    const linkedPrompts = prompts.filter(p => ids.includes(p.folder));
    
    let msg = `Xóa "${f.name}"?`;
    if (desc.length) msg += `\n\nBao gồm ${desc.length} thư mục con`;
    if (linkedPrompts.length) msg += `\n⚠️ Xóa luôn ${linkedPrompts.length} prompt`;
    if (!confirm(msg)) return;

    try {
        for (const p of linkedPrompts) await deleteDoc(doc(db, ...getUserPath(), 'prompts', p.id));
        for (const x of allF.reverse()) await deleteDoc(doc(db, ...getUserPath(), 'folders', x.id));
        if (ids.includes(currentFolder)) currentFolder = 'all';
        selectedPrompt = null;
        await loadData();
        toast('Đã xóa thư mục');
    } catch (e) { toast('Lỗi: ' + e.message, true); }
}

$('addFolderBtn').addEventListener('click', () => {
    $('folderModalTitle').textContent = 'Thêm thư mục gốc';
    $('folderSubmitBtn').textContent = 'Tạo';
    $('folderForm').reset();
    $('folderId').value = '';
    delete $('folderName').dataset.parentId;
    $('folderModal').classList.add('active');
});

$('closeFolderModal').addEventListener('click', () => $('folderModal').classList.remove('active'));
$('cancelFolderBtn').addEventListener('click', () => $('folderModal').classList.remove('active'));

$('folderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = $('folderId').value;
    const name = $('folderName').value.trim();
    const parentId = $('folderName').dataset.parentId || null;
    try {
        if (id) {
            const data = { name, updatedAt: new Date().toISOString() };
            data.parentId = parentId;
            await setDoc(doc(db, ...getUserPath(), 'folders', id), data, { merge: true });
        } else {
            const data = { name, createdAt: new Date().toISOString() };
            if (parentId) data.parentId = parentId;
            await setDoc(doc(db, ...getUserPath(), 'folders', Date.now().toString()), data);
        }
        $('folderModal').classList.remove('active');
        delete $('folderName').dataset.parentId;
        await loadData();
        toast('Đã lưu thư mục');
    } catch (e) { toast('Lỗi: ' + e.message, true); }
});

function getFilteredPrompts() {
    const term = $('searchInput').value.toLowerCase();
    let list = prompts;
    if (currentFolder !== 'all') list = list.filter(p => p.folder === currentFolder);
    if (term) {
        list = list.filter(p =>
            p.title.toLowerCase().includes(term) ||
            p.content.toLowerCase().includes(term) ||
            (p.description && p.description.toLowerCase().includes(term)) ||
            (p.tags && p.tags.some(t => t.toLowerCase().includes(term)))
        );
    }
    return list.sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
}

function renderPromptList() {
    const list = getFilteredPrompts();
    if (list.length === 0) {
        $('promptList').innerHTML = `<div style="text-align:center; padding:40px 20px; color: var(--text-muted); font-size:13px;">Không có prompt nào</div>`;
        return;
    }
    $('promptList').innerHTML = list.map(p => {
        const folder = folders.find(f => f.id === p.folder);
        const date = new Date(p.updatedAt || p.createdAt).toLocaleDateString('vi-VN');
        return `
            <div class="prompt-item ${selectedPrompt === p.id ? 'active' : ''}" data-id="${p.id}">
                <div class="prompt-item-title">✨ ${p.title}</div>
                <div class="prompt-item-preview">${p.content}</div>
                <div class="prompt-item-meta">
                    <span>📁 ${folder ? folder.name : 'Chưa phân loại'}</span>
                    <span>📅 ${date}</span>
                </div>
            </div>
        `;
    }).join('');

    document.querySelectorAll('.prompt-item').forEach(item => {
        item.addEventListener('click', () => {
            selectedPrompt = item.dataset.id;
            renderPromptList();
            renderDetail();
        });
    });
}

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderDetail() {
    if (!selectedPrompt) {
        $('detailPane').innerHTML = `<div class="detail-empty"><div class="detail-empty-icon">📝</div><p>Chọn một prompt để xem chi tiết</p></div>`;
        return;
    }
    const p = prompts.find(x => x.id === selectedPrompt);
    if (!p) { selectedPrompt = null; return renderDetail(); }
    const folder = folders.find(f => f.id === p.folder);
    const created = new Date(p.createdAt).toLocaleDateString('vi-VN');
    const updated = p.updatedAt ? new Date(p.updatedAt).toLocaleDateString('vi-VN') : created;
    const tags = p.tags ? p.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';

    $('detailPane').innerHTML = `
        <div class="detail-header">
            <div class="detail-title-section">
                <div class="detail-title">✨ ${p.title}</div>
                <div class="detail-meta">
                    <span>📁 ${folder ? folder.name : 'Chưa phân loại'}</span>
                    <span>📅 Tạo: ${created}</span>
                    <span>🔄 Cập nhật: ${updated}</span>
                </div>
            </div>
            <div class="detail-actions">
                <button class="action-btn copy" id="copyBtn">📋 Copy Prompt</button>
                <button class="action-btn" id="editBtn">✏️ Sửa</button>
                <button class="action-btn delete" id="deleteBtn">🗑️ Xóa</button>
            </div>
        </div>
        <div class="detail-body">
            ${p.description ? `<div class="detail-description">💬 ${p.description}</div>` : ''}
            <div style="margin-top:16px;">
                <div style="font-size:11px; color: var(--text-muted); margin-bottom:8px; font-weight:600;">NỘI DUNG PROMPT</div>
                <div class="prompt-content" id="promptContent">${escapeHtml(p.content)}</div>
            </div>
            ${tags ? `<div class="detail-tags">${tags}</div>` : ''}
        </div>
    `;

    $('copyBtn').addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(p.content);
            const btn = $('copyBtn');
            btn.textContent = '✓ Đã copy!';
            btn.classList.add('copied');
            toast('Đã copy prompt vào clipboard');
            setTimeout(() => {
                btn.textContent = '📋 Copy Prompt';
                btn.classList.remove('copied');
            }, 2000);
        } catch (e) { toast('Không copy được', true); }
    });

    $('editBtn').addEventListener('click', () => openPromptModal(p));
    $('deleteBtn').addEventListener('click', async () => {
        if (!confirm('Xóa prompt này?')) return;
        try {
            await deleteDoc(doc(db, ...getUserPath(), 'prompts', p.id));
            selectedPrompt = null;
            await loadData();
            toast('Đã xóa');
        } catch (e) { toast('Lỗi: ' + e.message, true); }
    });
}

$('addPromptBtn').addEventListener('click', () => openPromptModal(null));

function openPromptModal(p) {
    $('promptModalTitle').textContent = p ? 'Chỉnh sửa prompt' : 'Thêm prompt mới';
    $('promptForm').reset();
    $('promptId').value = p ? p.id : '';
    if (p) {
        $('promptTitle').value = p.title;
        $('promptContent').value = p.content;
        $('promptDescription').value = p.description || '';
        $('promptTags').value = p.tags ? p.tags.join(', ') : '';
    }
    const roots = buildTree();
    function renderOpts(list, level = 0) {
        let out = '';
        list.forEach(f => {
            out += `<option value="${f.id}" ${p && p.folder === f.id ? 'selected' : ''}>${'— '.repeat(level)}${f.name}</option>`;
            if (f.children.length) out += renderOpts(f.children, level + 1);
        });
        return out;
    }
    $('promptFolder').innerHTML = renderOpts(roots);
    $('promptModal').classList.add('active');
}

$('closePromptModal').addEventListener('click', () => $('promptModal').classList.remove('active'));
$('cancelPromptBtn').addEventListener('click', () => $('promptModal').classList.remove('active'));

$('promptForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = $('promptId').value;
    const data = {
        title: $('promptTitle').value.trim(),
        content: $('promptContent').value,
        description: $('promptDescription').value.trim(),
        folder: $('promptFolder').value,
        tags: $('promptTags').value.split(',').map(t => t.trim()).filter(Boolean),
        updatedAt: new Date().toISOString()
    };
    try {
        if (id) {
            const existing = prompts.find(p => p.id === id);
            data.createdAt = existing.createdAt;
            await setDoc(doc(db, ...getUserPath(), 'prompts', id), data);
        } else {
            data.createdAt = new Date().toISOString();
            const newId = Date.now().toString();
            await setDoc(doc(db, ...getUserPath(), 'prompts', newId), data);
            selectedPrompt = newId;
        }
        $('promptModal').classList.remove('active');
        await loadData();
        toast('Đã lưu prompt');
    } catch (e) { toast('Lỗi: ' + e.message, true); }
});

$('searchInput').addEventListener('input', renderPromptList);

document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        $('searchInput').focus();
        $('searchInput').select();
    }
});

$('exportBtn').addEventListener('click', () => {
    const data = { version: '1.0-prompt', exportedAt: new Date().toISOString(), folders, prompts };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `prompt-manager-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Đã xuất JSON');
});

$('importBtn').addEventListener('click', () => $('importFile').click());

$('importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
        const data = JSON.parse(await file.text());
        if (!data.folders || !data.prompts) throw new Error('File không hợp lệ');
        for (const f of data.folders) {
            await setDoc(doc(db, ...getUserPath(), 'folders', f.id), {
                name: f.name, parentId: f.parentId || null, createdAt: f.createdAt || new Date().toISOString()
            });
        }
        for (const p of data.prompts) {
            await setDoc(doc(db, ...getUserPath(), 'prompts', p.id), {
                title: p.title, content: p.content, description: p.description || '',
                folder: p.folder, tags: p.tags || [],
                createdAt: p.createdAt || new Date().toISOString(),
                updatedAt: p.updatedAt || new Date().toISOString()
            });
        }
        await loadData();
        toast('Đã nhập thành công');
    } catch (err) { toast('Lỗi: ' + err.message, true); }
    $('importFile').value = '';
});

window.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal')) e.target.classList.remove('active');
});
</script>
